<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4fa3"></head><body>
<title>Spanish Fast Track</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column, azulejo-tile accents. Home = today's loop + road to fluency; each module = one big card you talk to. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#e8ecf3; --line:#d5dbe6;
  --fg:#16213a; --muted:#5b6782;
  --cobalt:#1f4fa3; --cobalt-soft:#dfe8f8;
  --ochre:#b9771a; --ochre-soft:#f7ead3;
  --teal:#137566; --teal-soft:#d8efea;
  --plum:#7a3b78; --plum-soft:#f1e1f0;
  --stone:#5d6474; --stone-soft:#e7e9ee;
  --good:#1d7a45; --good-soft:#dcf1e4; --bad:#b23b2e; --bad-soft:#f8e0dc;
  --f-display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1524; --surface:#172034; --sunk:#111a2b; --line:#2a3650;
  --fg:#e8edf7; --muted:#9aa6c0;
  --cobalt:#8fb0f0; --cobalt-soft:#1c2b4d;
  --ochre:#e7b25c; --ochre-soft:#3a2c14;
  --teal:#5cc9b5; --teal-soft:#123a35;
  --plum:#d79bd4; --plum-soft:#3a2039;
  --stone:#aab1c2; --stone-soft:#262f42;
  --good:#6fd39a; --good-soft:#163826; --bad:#f08b7e; --bad-soft:#40201c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1524; --surface:#172034; --sunk:#111a2b; --line:#2a3650;
  --fg:#e8edf7; --muted:#9aa6c0;
  --cobalt:#8fb0f0; --cobalt-soft:#1c2b4d;
  --ochre:#e7b25c; --ochre-soft:#3a2c14;
  --teal:#5cc9b5; --teal-soft:#123a35;
  --plum:#d79bd4; --plum-soft:#3a2039;
  --stone:#aab1c2; --stone-soft:#262f42;
  --good:#6fd39a; --good-soft:#163826; --bad:#f08b7e; --bad-soft:#40201c;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.2rem,7vw,3.2rem)} h2{font-size:clamp(1.7rem,5vw,2.2rem)} h3{font-size:1.35rem}
p{margin:0}
a{color:var(--cobalt)}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;font-weight:600;background:var(--sunk);border:1px solid var(--line);text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--cobalt);color:var(--surface);border-color:var(--cobalt)}
.btn.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.small{min-height:40px;padding:0 14px;font-size:.9rem}
.btn.big{min-height:64px;font-size:1.1rem;width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.kbd{font-family:var(--f-mono);font-size:.7rem;opacity:.6;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.tile-mark{width:34px;height:34px;border-radius:6px;background:
  radial-gradient(circle at 50% 50%,var(--ochre) 0 18%,transparent 19%),
  conic-gradient(var(--cobalt) 0 25%,var(--cobalt-soft) 0 50%,var(--cobalt) 0 75%,var(--cobalt-soft) 0);}
.brand b{font-family:var(--f-display);font-size:1.5rem;font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;font-weight:600}
.chip .n{font-variant-numeric:tabular-nums}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.8rem;color:var(--muted)}
.loop{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px 16px;text-align:left;border-top:1px solid var(--line);width:100%}
.step:first-child{border-top:0}
.step:hover{background:var(--sunk)}
.step .num{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;background:var(--sunk)}
.step .t{font-weight:600}
.step .d{font-size:.88rem;color:var(--muted)}
.step .tag,.tagx{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.talk{background:var(--cobalt-soft);color:var(--cobalt)}
.tag.tap{background:var(--ochre-soft);color:var(--ochre)}
.tag.listen{background:var(--teal-soft);color:var(--teal)}
.tag.done{background:var(--good-soft);color:var(--good)}
.note{font-size:.88rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rung{border-radius:10px;padding:8px;text-align:center;background:var(--sunk);display:flex;flex-direction:column;gap:2px;min-width:0}
.rung b{font-family:var(--f-display);font-size:1.5rem;font-weight:400;line-height:1}
.rung span{font-size:.7rem;color:var(--muted)}
.rung.reached{background:var(--good-soft);color:var(--good)} .rung.reached span{color:var(--good)}
.rung.working{background:var(--cobalt-soft);color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt) inset} .rung.working span{color:var(--cobalt)}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.weekdots{display:flex;gap:6px}
.weekdots span{flex:1;height:34px;border-radius:6px;background:var(--sunk);position:relative;display:flex;align-items:flex-end;justify-content:center;font-size:.65rem;color:var(--muted);padding-bottom:2px;overflow:hidden}
.weekdots span i{position:absolute;left:0;right:0;bottom:0;background:var(--teal-soft);border-top:2px solid var(--teal)}
.weekdots span em{position:relative;font-style:normal}

/* profiles */
.profiles{display:flex;gap:10px;flex-wrap:wrap}
.pf{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:52px}
.pf.on{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt) inset}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--cobalt-soft);color:var(--cobalt)}
.addpf{display:flex;gap:8px;flex-wrap:wrap}
.addpf input,.field{flex:1;min-width:0;min-height:48px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font:inherit;color:inherit}

/* module header */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--cobalt);min-height:44px;white-space:nowrap}
.settings{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.88rem;font-weight:600;min-height:40px}
.toggle[aria-pressed="true"]{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt)}

/* drill card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:18px;align-items:stretch}
.card .progress{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.card .progress i{display:block;height:100%;background:var(--cobalt);width:0;transition:width .3s}
.prompt-label{display:flex;justify-content:space-between;gap:8px;align-items:center}
.prompt{font-family:var(--f-display);font-size:clamp(2rem,8vw,3rem);line-height:1.1;text-align:center;overflow-wrap:anywhere;padding:8px 0}
.prompt.es{color:var(--cobalt)}
.hint{text-align:center;color:var(--muted);font-size:.95rem}
.answer{border-top:1px dashed var(--line);padding-top:16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.answer .es{font-family:var(--f-display);font-size:clamp(1.8rem,7vw,2.6rem);color:var(--teal);line-height:1.15;overflow-wrap:anywhere}
.answer .en{color:var(--muted)}
.why{font-size:.92rem;background:var(--ochre-soft);color:var(--fg);border-radius:10px;padding:10px 12px;text-align:left}
.why b{color:var(--ochre)}
.heard{font-size:.95rem;text-align:center;padding:8px 12px;border-radius:10px}
.heard.ok{background:var(--good-soft);color:var(--good)} .heard.no{background:var(--bad-soft);color:var(--bad)} .heard.wait{background:var(--sunk);color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.actions .btn{flex:1 1 140px;max-width:260px}
.mic{width:84px;height:84px;border-radius:50%;background:var(--cobalt);color:var(--surface);display:grid;place-items:center;align-self:center;font-weight:700}
.mic.live,.rec.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cobalt) 50%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
@media (prefers-reduced-motion: reduce){.mic.live,.rec.live{animation:none;outline:4px solid var(--ochre)}.card .progress i{transition:none}}
.countdown{text-align:center;font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.summary{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* lists / pickers */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;text-decoration:none;color:var(--fg)}
.pick:hover{border-color:var(--cobalt)}
.pick .big{font-family:var(--f-mono);font-size:1rem;color:var(--cobalt)}
.pick .ex{font-size:.88rem;color:var(--muted)}
.pick .lvl{font-size:.75rem;font-weight:600;color:var(--good)}

/* sentence builder */
.builder{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.col{display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;min-width:0}
.col h4{margin:0;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:0 4px}
.w{border-radius:10px;padding:10px;text-align:left;font-weight:600;font-size:.95rem;border:2px solid transparent;line-height:1.25}
.w small{display:block;font-weight:400;font-size:.75rem;opacity:.8}
.c0 h4,.c0 .w{color:var(--cobalt)} .c0 .w{background:var(--cobalt-soft)}
.c1 h4,.c1 .w{color:var(--ochre)} .c1 .w{background:var(--ochre-soft)}
.c2 h4,.c2 .w{color:var(--teal)} .c2 .w{background:var(--teal-soft)}
.c3 h4,.c3 .w{color:var(--plum)} .c3 .w{background:var(--plum-soft)}
.c4 h4,.c4 .w{color:var(--stone)} .c4 .w{background:var(--stone-soft)}
.c5 h4,.c5 .w{color:var(--cobalt)} .c5 .w{background:var(--cobalt-soft)}
.w.sel{border-color:currentColor}
.built{font-family:var(--f-display);font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.2;min-height:2.6rem;text-align:center}
.built span{padding:0 2px;border-bottom:3px solid}
.built .c0{border-color:var(--cobalt)} .built .c1{border-color:var(--ochre)} .built .c2{border-color:var(--teal)} .built .c3{border-color:var(--plum)} .built .c4{border-color:var(--stone)} .built .c5{border-color:var(--cobalt)}
.built-en{text-align:center;color:var(--muted)}

/* conjugation grid */
.conj-wrap{overflow-x:auto}
table.conj{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:420px}
.conj th,.conj td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
.conj th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.conj td{font-family:var(--f-mono);font-size:.92rem}
.conj td b{color:var(--ochre);font-weight:500}
.conj tr.dim td{opacity:.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 14px;font-weight:600;font-size:.9rem;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--cobalt);color:var(--surface)}
select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px}

/* dialogue */
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.who{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.who.a{background:var(--cobalt-soft);color:var(--cobalt)} .who.b{background:var(--ochre-soft);color:var(--ochre)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.bubble.now{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt) inset}
.bubble .es{font-weight:600}
.bubble .es.hide{filter:blur(6px);user-select:none}
.bubble .en{font-size:.88rem;color:var(--muted)}

/* checklists, logs, recordings */
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--sunk);text-align:left;width:100%}
.check .box{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;background:var(--surface)}
.check[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.loglist{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.loglist div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.qcard{background:var(--sunk);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.qcard .es{font-family:var(--f-display);font-size:1.6rem;color:var(--cobalt);line-height:1.15}
.rec{width:72px;height:72px;border-radius:50%;background:var(--bad);color:var(--surface);font-weight:700;display:grid;place-items:center}
audio{width:100%;max-width:100%}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--cobalt);color:var(--surface);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .tip{display:block;margin-top:6px;font-size:.85rem;color:var(--ochre)}
.composer{display:flex;gap:8px}
.composer textarea{flex:1;min-width:0;min-height:56px;max-height:140px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;font:inherit;color:inherit;resize:vertical}

@media (max-width:480px){
  .stats{gap:6px}
  .stat{padding:10px}
  .stat .v{font-size:1.6rem}
  .step{grid-template-columns:34px 1fr;}
  .step .tag{grid-column:2;justify-self:start}
  .step .num{width:34px;height:34px}
  .card{padding:20px 14px}
}
</style>

<div class="wrap" id="app"></div>

<script>
/* ============ CONTENT (Mexican / Latin American Spanish) ============ */
const COGNATE_RULES = [
  {id:"cion", en:"-tion", es:"-ción", words:[["nation","nación"],["information","información"],["education","educación"],["situation","situación"],["conversation","conversación"],["celebration","celebración"],["reservation","reservación"],["communication","comunicación"],["solution","solución"],["imagination","imaginación"]]},
  {id:"sion", en:"-sion", es:"-sión", words:[["decision","decisión"],["television","televisión"],["vision","visión"],["tension","tensión"],["mission","misión"],["profession","profesión"],["expression","expresión"],["confusion","confusión"]]},
  {id:"idad", en:"-ity", es:"-idad", words:[["city","ciudad"],["university","universidad"],["possibility","posibilidad"],["activity","actividad"],["reality","realidad"],["opportunity","oportunidad"],["quality","calidad"],["electricity","electricidad"],["personality","personalidad"]]},
  {id:"al", en:"-al", es:"-al", words:[["normal","normal"],["personal","personal"],["hospital","hospital"],["natural","natural"],["animal","animal"],["original","original"],["final","final"],["central","central"],["total","total"]]},
  {id:"ble", en:"-ble", es:"-ble", words:[["possible","posible"],["terrible","terrible"],["horrible","horrible"],["flexible","flexible"],["comfortable","cómodo"],["probable","probable"],["visible","visible"],["incredible","increíble"]], trap:"comfortable is the odd one: cómodo"},
  {id:"oso", en:"-ous", es:"-oso", words:[["famous","famoso"],["delicious","delicioso"],["nervous","nervioso"],["curious","curioso"],["generous","generoso"],["religious","religioso"],["precious","precioso"],["mysterious","misterioso"]]},
  {id:"ista", en:"-ist", es:"-ista", words:[["artist","artista"],["dentist","dentista"],["tourist","turista"],["optimist","optimista"],["journalist","periodista"],["pianist","pianista"],["specialist","especialista"]], trap:"journalist is the odd one: periodista"},
  {id:"ismo", en:"-ism", es:"-ismo", words:[["tourism","turismo"],["optimism","optimismo"],["realism","realismo"],["capitalism","capitalismo"],["journalism","periodismo"],["activism","activismo"]]},
  {id:"ario", en:"-ary", es:"-ario", words:[["dictionary","diccionario"],["necessary","necesario"],["salary","salario"],["vocabulary","vocabulario"],["ordinary","ordinario"],["anniversary","aniversario"],["contrary","contrario"]]},
  {id:"ico", en:"-ic", es:"-ico", words:[["electric","eléctrico"],["fantastic","fantástico"],["romantic","romántico"],["public","público"],["music","música"],["classic","clásico"],["artistic","artístico"],["typical","típico"]]},
  {id:"ente", en:"-ent / -ant", es:"-ente / -ante", words:[["important","importante"],["different","diferente"],["intelligent","inteligente"],["elegant","elegante"],["patient","paciente"],["restaurant","restaurante"],["excellent","excelente"],["president","presidente"]]},
  {id:"ivo", en:"-ive", es:"-ivo", words:[["creative","creativo"],["positive","positivo"],["negative","negativo"],["active","activo"],["expensive","caro"],["attractive","atractivo"],["productive","productivo"]], trap:"expensive is the odd one: caro"},

function conj(verb,tense){

  try{ await dbRef.set({json:JSON.stringify(S), updatedAt:S.updatedAt}); setSync("Synced to your account") }
  catch(e){ if(e&&e.code==="invalid_argument"){ dbRef=null; setSync("Saved on this device") } }
  saving=false; if(pendingSave){ pendingSave=false; pushDb() }
}

const BOX_DAYS=[0,1,2,4,8,16,32];
function grade(id,ok){
  const p=P(); const c=p.cards[id]||{box:0,due:0};
  c.box = ok ? Math.min(c.box+1,6) : 1;
  c.due = Date.now() + BOX_DAYS[c.box]*86400000 - 3600000;
  p.cards[id]=c; if(ok) p.xp=(p.xp||0)+1; markActivity(); save();
}
function seed(cards,box=2){ const p=P(); for(const c of cards){ const s=p.cards[c.id]; if(!s||s.box<box) p.cards[c.id]={box,due:Date.now()+BOX_DAYS[box]*86400000} } }
function pickSession(cards,size=10,newMax=6){
  const now=Date.now(), st=P().cards;
  const due=cards.filter(c=>st[c.id]&&st[c.id].due<=now).sort((a,b)=>st[a.id].due-st[b.id].due);
  const fresh=cards.filter(c=>!st[c.id]);
  const out=due.slice(0,size);
  for(const c of fresh){ if(out.length>=size||out.filter(x=>!st[x.id]).length>=newMax) break; out.push(c) }
  if(out.length<Math.min(4,cards.length)){ const rest=shuffle(cards.filter(c=>!out.includes(c))); out.push(...rest.slice(0,Math.min(size,cards.length)-out.length)) }
  return shuffle(out);
}
function knownCount(){ const p=P(); if(!p) return 0; return Object.values(p.cards).filter(c=>c.box>=2).length }

let voices=[];
function loadVoices(){ try{ voices=speechSynthesis.getVoices() }catch(e){ voices=[] } }
try{ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices }catch(e){}
function esVoice(){ return voices.find(v=>/^es[-_]MX/i.test(v.lang)) || voices.find(v=>/^es[-_](US|419)/i.test(v.lang)) || voices.find(v=>/^es/i.test(v.lang)) }
function enVoice(){ return voices.find(v=>/^en[-_]/i.test(v.lang)) }
function speak(text,lang="es",rate){
  return new Promise(res=>{
    try{
      if(!("speechSynthesis" in window)) return res();
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text.replace(/[¿¡]/g,""));
      u.lang = lang==="es" ? "es-MX" : "en-US";
      const v = lang==="es"?esVoice():enVoice(); if(v) u.voice=v;
      u.rate = rate || (lang==="es" ? S.settings.rate : 1);
      let done=false; const fin=()=>{ if(!done){ done=true; res() } };
      u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
      setTimeout(fin, 1500 + text.length*150/(u.rate||1));
    }catch(e){ res() }
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let micState = Rec ? "unknown" : "none"; // unknown | ok | blocked | none
function listen(){
  return new Promise((resolve)=>{
    if(!Rec || micState==="blocked"||micState==="none") return resolve({error:"blocked"});
    let r; try{ r=new Rec() }catch(e){ micState="blocked"; return resolve({error:"blocked"}) }
    r.lang="es-MX"; r.interimResults=false; r.maxAlternatives=5;
    let done=false;
    r.onresult=e=>{ done=true; micState="ok"; const alts=[...e.results[0]].map(a=>a.transcript); resolve({alts}) };
    r.onerror=e=>{ if(done) return; done=true; if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)) micState="blocked"; resolve({error:e.error}) };
    r.onend=()=>{ if(!done){ done=true; resolve({error:"no-speech"}) } };
    try{ r.start() }catch(e){ micState="blocked"; resolve({error:"blocked"}) }
  });
}
function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,;:"']/g,"").replace(/\s+/g," ").trim()
    .replace(/^(el|la|los|las|un|una) /,"");
}
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur } return prev[n] }
function matches(heard,answers){
  const h=heard.map(norm);
  for(const a of answers.map(norm)) for(const x of h){ const tol = a.length<=5?1:a.length<=14?2:Math.ceil(a.length*.15); if(x===a||lev(x,a)<=tol||x.includes(a)) return true }
  return false;
}

const COG_WHY="English and Spanish both took these words from Latin, so the middle stays and only the ending changes. Say it with the stress where the accent mark is.";
function cognateCards(rule){ return rule.words.map(([en,es])=>({id:"cg:"+rule.id+":"+en, prompt:en, pLang:"en", answer:es, label:"Say it in Spanish", note:rule.en+" → "+rule.es, why:rule.trap&&rule.words.some(w=>w[0]===en&&rule.trap.startsWith(en))?rule.trap:COG_WHY})) }
const ALL_COG = () => COGNATE_RULES.flatMap(cognateCards);
const FF_CARDS = FALSE_FRIENDS.map(([es,en,why])=>({id:"ff:"+es, prompt:es, pLang:"es", answer:en, aLang:"en", label:"What does it really mean?", note:why, selfOnly:true}));
const VERB_CARDS = POWER_VERBS.map(([es,en,ex,why])=>({id:"pv:"+es, prompt:en, pLang:"en", answer:es, label:"Say the verb", example:ex, why}));
const CHAIN_CARDS = CHAINS.map(([en,es])=>({id:"ch:"+es, prompt:en, pLang:"en", answer:es, label:"Chain it: helper + infinitive", why:CHAIN_WHY}));
const TR_CARDS = TRANSLATE.map(([lvl,en,es,alt])=>({id:"tr:"+es, lvl, prompt:en, pLang:"en", answer:es, alts:alt||[], label:"Build it out loud", why:LEVEL_WHY[lvl]}));
function conjCards(verbs,tense){
  const out=[]; for(const v of verbs){ const {forms}=conj(v,tense); forms.forEach((f,i)=>{ if(i===4&&!S.settings.vosotros) return;
    out.push({id:"cj:"+tense+":"+v+":"+i, prompt:PRON_SHORT[i]+" · "+v, pLang:"es", answer:f, label: tense==="present"?"Present tense":"Past (preterite)", speakPrompt:false, why:TENSE_WHY[tense]}) }) } return out;
}
/* Placement: a few probes per group; a group passed means its whole deck starts as known */
const PLACEMENT = [
  {g:"cog", c:{id:"pl:1",prompt:"information",pLang:"en",answer:"información"}},
  {g:"cog", c:{id:"pl:2",prompt:"possibility",pLang:"en",answer:"posibilidad"}},
  {g:"verbs", c:{id:"pl:3",prompt:"to know (facts)",pLang:"en",answer:"saber"}},
  {g:"verbs", c:{id:"pl:4",prompt:"to put",pLang:"en",answer:"poner"}},
  {g:"chains", c:{id:"pl:5",prompt:"I have to work",pLang:"en",answer:"tengo que trabajar"}},
  {g:"present", c:{id:"pl:6",prompt:"tú · comer",pLang:"es",answer:"comes",speakPrompt:false}},
  {g:"present", c:{id:"pl:7",prompt:"nosotros · ir",pLang:"es",answer:"vamos",speakPrompt:false}},
  {g:"tr3", c:{id:"pl:8",prompt:"I'm going to call you tomorrow.",pLang:"en",answer:"Voy a llamarte mañana.",alts:["Te voy a llamar mañana."]}},
  {g:"tr4", c:{id:"pl:9",prompt:"I don't understand, can you repeat it?",pLang:"en",answer:"No entiendo, ¿puede repetirlo?",alts:["No entiendo, ¿puedes repetirlo?"]}},
  {g:"past", c:{id:"pl:10",prompt:"yo · hacer (past)",pLang:"es",answer:"hice",speakPrompt:false}},
  {g:"past", c:{id:"pl:11",prompt:"What did you do this weekend?",pLang:"en",answer:"¿Qué hiciste este fin de semana?"}},
];
const PLACE_GROUPS = {cog:"Cognates", verbs:"Power verbs", chains:"Verb chains", present:"Present tense", tr3:"Translate levels 1 to 3", tr4:"Translate level 4", past:"Past tense"};
function applyPlacement(results){
  const pass={}; PLACEMENT.forEach((p,i)=>{ pass[p.g] = (pass[p.g]!==false) && !!results[i] });
  if(pass.cog) seed(ALL_COG());
  if(pass.verbs) seed(VERB_CARDS);
  if(pass.chains) seed(CHAIN_CARDS);
  if(pass.present) seed(conjCards(CONJ_VERBS,"present"));
  if(pass.tr3) seed(TR_CARDS.filter(c=>c.lvl<=3));
  if(pass.tr4) seed(TR_CARDS.filter(c=>c.lvl===4));
  if(pass.past){ seed(conjCards(Object.keys(IRREG.preterite).concat(REGULARS),"preterite")); seed(TR_CARDS.filter(c=>c.lvl===5)) }
  const p=P(); p.placed=true; p.placement={date:today(),pass}; save(); return pass;
}
function sessionCards(){
  const lvlMax = Math.max(2, ...TR_CARDS.filter(c=>{ const s=P().cards[c.id]; return s&&s.box>=2 }).map(c=>c.lvl+1));
  const pool=[...pickSession(VERB_CARDS,6,3),...pickSession(CHAIN_CARDS,6,3),...pickSession(ALL_COG(),8,4),
    ...pickSession(conjCards(CONJ_VERBS,"present"),8,4),...pickSession(TR_CARDS.filter(c=>c.lvl<=lvlMax),8,4)];
  const seen=new Set(); return pool.filter(c=>!seen.has(c.id)&&seen.add(c.id));
}

async function reveal(){ const d=view.drill; d.revealed=true; render(); const c=d.cards[d.i]; await speak(c.answer,c.aLang||"es") }
async function micAnswer(){
  const d=view.drill; const c=d.cards[d.i]; d.listening=true; d.heard={cls:"wait",text:"Listening… say it in Spanish"}; render();
  const r=await listen(); d.listening=false;
  if(r.error){ d.heard = micState==="blocked" ? {cls:"wait",text:"The mic isn't available here. Say it out loud, then reveal."} : {cls:"wait",text:"Didn't catch that. Try again or reveal."}; render(); return }
  const ok=matches(r.alts,[c.answer,...(c.alts||[])]);
  d.heard={cls:ok?"ok":"no", text:(ok?"¡Sí! ":"Heard: ")+r.alts[0]};

let handsTimer=null;
async function handsLoop(){
  const d=view.drill; if(!d||!d.hands) return;
  if(d.i>=d.cards.length){ d.hands=false; render(); return }
  const c=d.cards[d.i]; d.revealed=false; render();
  await speak(c.prompt,c.pLang); if(!d.hands||view.drill!==d) return;
  const ms = 3500 + c.answer.length*90; let left=Math.ceil(ms/1000);
  const cd0=document.getElementById("cd"); if(cd0) cd0.textContent="Say it now… "+left;
  await new Promise(res=>{ handsTimer=setInterval(()=>{ left--; const el=document.getElementById("cd"); if(el) el.textContent= left>0?"Say it now… "+left:""; if(left<=0||!d.hands){ clearInterval(handsTimer); res() } },1000) });
  if(!d.hands||view.drill!==d) return;
  d.revealed=true; render(); await speak(c.answer,c.aLang||"es"); await wait(500); if(!d.hands||view.drill!==d) return; await speak(c.answer,c.aLang||"es",0.95);
  if(!d.hands||view.drill!==d) return;
  const st=P().cards[c.id]; if(!st||st.box<2) grade(c.id,true);
  d.i++; d.revealed=false; if(d.i>=d.cards.length){ finishDrill(); d.hands=false; render(); return }
  setTimeout(handsLoop,700);
}

    recState={mr,chunks,stream,start:Date.now()};
    mr.onstop=async()=>{ const st=recState; recState=null; stream.getTracks().forEach(t=>t.stop()); if(!st||st.discard) { render(); return }

}

  return `<div class="mhead">${back("← Scenarios","scclose")}${settingsBar()}</div>
  <div class="hero"><h2>${h(s[1])}</h2></div>
  <div class="chat" id="chatlog">${view.msgs.map(m=>`<div class="msg ${m.role==="user"?"me":"them"}">${h(m.es||m.content)}${m.tip?`<span class="tip">${h(m.tip)}</span>`:""}</div>`).join("")}${view.thinking?`<div class="msg them muted">Pensando…</div>`:""}</div>
  ${view.err?`<p class="note">${h(view.err)}</p>`:""}
  <form class="composer" id="composer"><label for="chatin" class="eyebrow" hidden>Your reply</label><textarea id="chatin" placeholder="Escribe o dicta en español…"></textarea><button class="btn primary" type="submit" ${view.thinking?"disabled":""}>Send</button></form>`;
}
function chatRules(s){ return `You are a Spanish conversation partner for an adult learner at about A2 level (rusty basics). Role: ${s[2]}
Rules: reply in 1 to 3 short sentences of simple, natural Mexican Spanish (use ustedes, never vosotros). Keep the conversation moving with one question. Never switch to English in the Spanish part.
After the Spanish, on its own new line, write "Tip:" followed by one short English sentence: if the learner's last message had a mistake, show the corrected Spanish; otherwise praise one thing or teach one useful phrase.
Start the role-play now with a greeting if the learner has not spoken yet.` }
async function chatSend(text){
  const s=SCENARIOS.find(x=>x[0]===view.sc); if(text) view.msgs.push({role:"user",content:text});
  view.thinking=true; view.err=null; render();
  const turns=[{role:"user",content:chatRules(s)},...view.msgs.map(m=>({role:m.role,content:m.content}))];
  if(turns[turns.length-1].role!=="user") turns.push({role:"user",content:"(continue)"});
  chatCtl=new AbortController();
  try{
    const {text:out}=await sample(turns,{cache:false,signal:chatCtl.signal,modelTier:"quick"});
    const [es,...tip]=out.split(/\n\s*Tip:/i);
    view.msgs.push({role:"assistant",content:out,es:es.trim(),tip:tip.length?"Tip: "+tip.join(" ").trim():""});
    view.thinking=false; render(); markDone("chat"); speak(es.trim(),"es");
  }catch(e){
    view.thinking=false;
    if(e.code==="cancelled"){}
    else if(e.code==="not_granted"||e.code==="sampling_disabled"){ view.err="Chat practice needs permission to use Claude. It stays off for this visit." }
    else if(e.code==="rate_limited"){ view.err="Too many messages for now. Try again in a little while." }
    else view.err="That message didn't go through. Send it again.";
    render();
  }
}

/* ============ MAIN RENDER ============ */
function render(){
  if(!S.active||!S.profiles[S.active]||view.name==="profiles"){ app.innerHTML=vProfiles(); bindForms(); return }
  const v={home:vHome,drill:vDrill,cognates:vCognates,verbs:vVerbs,builder:vBuilder,conj:vConj,translate:vTranslate,listen:vListen,chat:vChat,milestones:vMilestones,log:vLog}[view.name]||vHome;
  app.innerHTML=v(); bindForms();
  const cs=document.getElementById("chatstep"); if(cs) cs.hidden=!sample;
  const log=document.getElementById("chatlog"); if(log) log.scrollTop=log.scrollHeight;
  if(view.name==="milestones") drawRecordings();
}
function bindForms(){
  const f=document.getElementById("addpf");
  if(f) f.onsubmit=e=>{ e.preventDefault(); const n=document.getElementById("pfname").value.trim(); if(!n) return; if(!S.profiles[n]) S.profiles[n]=newProfile(); S.active=n; monthlyCache=null; save(); go("home") };
  const vs=document.getElementById("verbsel"); if(vs) vs.onchange=()=>{ view.verb=vs.value; render() };
  const cf=document.getElementById("composer");
  if(cf) cf.onsubmit=e=>{ e.preventDefault(); const t=document.getElementById("chatin").value.trim(); if(t) chatSend(t) };
}
function shuffle(a){ return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]) }
function speakBuild(bb,sel){ return speak(sel.map((s,i)=>s==null?"":bb.cols[i][1][s][0]).join(" "),"es") }

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  const d=view.drill;
  switch(a){
    case "home": go("home"); break;
    case "switch": go("profiles"); break;
    case "pick": S.active=b.dataset.name; monthlyCache=null; save(); go("home"); break;
    case "open": go(b.dataset.mod); break;
    case "rate": S.settings.rate = S.settings.rate<0.8?0.9:0.7; save(); render(); break;
    case "say": speak(b.dataset.text,"es"); break;
    case "session": startDrill("Hands-free session","session",sessionCards(),{hands:true,session:true}); break;
    case "placement": startDrill("Placement","placement",PLACEMENT.map(p=>({...p.c,label:"Placement check"})),{placement:true}); break;
    /* drill */
    case "play": autoPrompt(); break;
    case "reveal": reveal(); break;
    case "playans": speak(d.cards[d.i].answer,d.cards[d.i].aLang||"es"); break;
    case "hit": nextCard(true); break;
    case "miss": nextCard(false); break;
    case "mic": micAnswer(); break;
    case "again": { const src=d.source; startDrill(d.title,d.mod,pickSession(src,Math.min(10,src.length))); break }
    case "handsfree": d.hands=!d.hands; clearInterval(handsTimer); try{speechSynthesis.cancel()}catch(x){} d.revealed=false; render(); if(d.hands) handsLoop(); break;
    /* cognates */
    case "cogrule": { const r=COGNATE_RULES.find(x=>x.id===b.dataset.id); startDrill("Cognates "+r.en+" → "+r.es,"cognates",shuffle(cognateCards(r))); break }
    case "cogmix": startDrill("Mixed cognates","cognates",pickSession(ALL_COG(),12,8)); break;
    case "ffround": startDrill("False friends","cognates",pickSession(FF_CARDS,8,8)); break;
    /* verbs */
    case "verbround": startDrill("Power verbs","verbs",pickSession(VERB_CARDS,10,6)); break;
    case "chainround": startDrill("Chains","verbs",pickSession(CHAIN_CARDS,10,8)); break;
    /* builder */
    case "bopen": { const bb=BUILDERS.find(x=>x.id===b.dataset.id); view.b=bb.id; view.sel=bb.cols.map(()=>null); view.ch=null; render(); break }
    case "bclose": view.b=null; render(); break;
    case "bpick": { const c=+b.dataset.c, w=+b.dataset.w; view.sel[c]= view.sel[c]===w?null:w; render(); const bb=BUILDERS.find(x=>x.id===view.b); if(view.sel[c]!=null) speak(bb.cols[c][1][w][0],"es");
      if(view.ch!=null && view.sel.every((s,i)=>s===bb.challenges[view.ch][1][i])){ markDone("builder"); setTimeout(()=>speakBuild(bb,view.sel),700) } break }
    case "bspeak": speakBuild(BUILDERS.find(x=>x.id===view.b),view.sel); break;
    case "brandom": { const bb=BUILDERS.find(x=>x.id===view.b); view.ch=null; view.sel=randomBuild(bb); render(); speakBuild(bb,view.sel); break }
    case "bchallenge": { const bb=BUILDERS.find(x=>x.id===view.b); view.ch=0; view.sel=bb.cols.map(()=>null); render(); speak(bb.challenges[0][0],"en"); break }
    case "bnext": { const bb=BUILDERS.find(x=>x.id===view.b); view.ch=(view.ch+1)%bb.challenges.length; view.sel=bb.cols.map(()=>null); render(); speak(bb.challenges[view.ch][0],"en"); break }
    /* conj */
    case "tense": view.tense=b.dataset.t; render(); break;
    case "voso": S.settings.vosotros=!S.settings.vosotros; save(); render(); break;
    case "conjround": startDrill("Conjugate "+(view.verb||"hablar"),"conj",shuffle(conjCards([view.verb||"hablar"],view.tense||"present"))); break;
    case "conjmix": startDrill("Regular verbs","conj",pickSession(conjCards(REGULARS,view.tense||"present"),12,8)); break;
    case "conjirr": startDrill("Irregular verbs","conj",pickSession(conjCards(Object.keys(IRREG[view.tense||"present"]),view.tense||"present"),12,8)); break;
    /* translate */
    case "trlevel": { const l=+b.dataset.l; startDrill("Translate · level "+l,"translate",pickSession(TR_CARDS.filter(c=>c.lvl===l),8,8)); break }
    /* listen */
    case "dopen": view.dl=b.dataset.id; view.shown={}; view.dshow=false; render(); break;
    case "dclose": stopAll(); view.dl=null; render(); break;
    case "dshow": view.dshow=!view.dshow; render(); break;
    case "dline": { const i=+b.dataset.i; view.shown[i]=true; render(); const dd=DIALOGUES.find(x=>x.id===view.dl); speak(dd.lines[i][1],"es"); break }
    case "ddone": markDone("listen"); go("home"); break;
    case "shadow": shadowLoop(); break;
    case "shstop": view.shadowing=false; try{speechSynthesis.cancel()}catch(x){} view.now=null; render(); break;
    case "dplay": (async()=>{ if(view.playing) return; view.playing=true; render(); const dd=DIALOGUES.find(x=>x.id===view.dl); const id=view.dl;
      for(let i=0;i<dd.lines.length;i++){ if(view.dl!==id||view.name!=="listen"||!view.playing) break; view.now=i; render(); await speak(dd.lines[i][1],"es"); await wait(450) } view.playing=false; view.now=null; if(view.name==="listen") render() })(); break;
    /* milestones */
    case "cando": { const c=P().cando; c[b.dataset.id]=!c[b.dataset.id]; save(); render(); break }
    case "recstart": startRecording(); break;
    case "recstop": stopRecording(); break;
    case "recdel": recDel(b.dataset.id).then(()=>{ monthlyCache=null; drawRecordings() }); break;
    /* log */
    case "addlisten": { const m=+b.dataset.m; P().listen.push({d:today(),m,t:Date.now()}); markActivity(); save(); render(); break }
    case "addconvo": { const w=document.getElementById("cwith").value, m=+document.getElementById("cmin").value; P().convo.push({d:today(),m,with:w,t:Date.now()}); markActivity(); save(); render(); break }
    case "nextq": view.qi=((view.qi||0)+1)%PARTNER_QS.length; render(); speak(PARTNER_QS[view.qi][0],"es"); break;
    /* chat */
    case "scopen": view.sc=b.dataset.id; view.msgs=[]; view.err=null; render(); chatSend(null); break;
    case "scclose": if(chatCtl) chatCtl.abort(); view.sc=null; render(); break;
  }
});
document.addEventListener("keydown",e=>{
  if(view.name!=="drill"||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; const d=view.drill; if(!d||d.hands||d.i>=d.cards.length) return;
  if(e.code==="Space"&&!d.revealed){ e.preventDefault(); reveal() }
  else if(d.revealed&&e.key==="1") nextCard(false);
  else if(d.revealed&&e.key==="2") nextCard(true);
});

/* ============ BOOT ============ */
(function boot(){
  const saved=lsRead(); if(saved&&saved.profiles) S={...S,...saved,settings:{...S.settings,...(saved.settings||{})}};
  render();
  if(window.claude&&claude.use){
    (async()=>{
      try{
        const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
        const uid = user ? await user.id() : null;
        if(db&&uid){
          dbRef=db.doc("data/users/"+uid+"/state");
          const snap=await dbRef.get();
          if(snap.exists){ const body=snap.data(); if(body.updatedAt>(S.updatedAt||0)){ try{ S=JSON.parse(body.json); lsWrite(); setSync("Synced to your account"); render() }catch(x){} } else setSync("Synced to your account") }
          else if(Object.keys(S.profiles).length) pushDb(); else setSync("Progress will sync to your account");
        }
      }catch(x){}
    })();
    (async()=>{ try{ sample=await claude.use("sample"); render() }catch(x){ sample=null } })();
  }
})();
</script>
